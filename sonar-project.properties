# Project identification
sonar.projectKey=CineVault
sonar.projectName=CineVault
sonar.projectVersion=1.0

# Backend source directory
sonar.sources=backend

# Test directory
sonar.tests=backend/test

# JavaScript test and coverage configuration
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# Exclude test files and generated files from source analysis
sonar.exclusions=backend/test/**,backend/coverage/**,backend/node_modules/**

# Test file patterns
sonar.test.inclusions=backend/test/**/*.test.js

# Encoding
sonar.sourceEncoding=UTF-8



