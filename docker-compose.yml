services:

  # FRONTEND 
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: cinevault-frontend

    ports:
      - "8080:80"

    depends_on:
      - backend

    restart: unless-stopped


  # BACKEND 
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: cinevault-backend

    ports:
      - "5000:5000"

    env_file:
      - ./backend/.env

    environment:
      PORT: 5000
      DYNAMODB_ENDPOINT: http://dynamodb:8000

    depends_on:
      - dynamodb

    restart: unless-stopped


  # DATABASE 
  dynamodb:
    image: amazon/dynamodb-local:latest

    container_name: cinevault-dynamodb

    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"

    working_dir: /home/dynamodblocal

    ports:
      - "8000:8000"

    volumes:
      - dynamodb-data:/home/dynamodblocal/data

    restart: unless-stopped


#  PERSISTENT VOLUME 
volumes:
  dynamodb-data: